<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="Arrow Escape — a minimalist logic puzzle: tap the arrows in the right order to clear the board. Locks & keys, daily challenge, zen and time-rush modes.">
<title>Arrow Escape</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6bff'/%3E%3Cpath d='M14 20h22v24M14 44h12' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M36 32h10' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M44 24l9 8-9 8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#101a3e;--text:#101a3e;--mut:#6b7390;--line:#e7eaf2;--pri:#2f6bff;--pri-d:#1f50d6;--pri-t:rgba(47,107,255,.1);
  --dot:#c5cbda;--red:#ef4444;--green:#16a34a;--gold:#f5b000;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);--r:18px}
body.dark{--bg:#0d1120;--surface:#171c30;--ink:#e8ecfb;--text:#e8ecfb;--mut:#8b93b0;--line:#252b44;--pri:#5b8cff;--pri-d:#3e6fe6;--pri-t:rgba(91,140,255,.14);--dot:#363d5c;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}
body.sand{--bg:#f6efe3;--surface:#fffaf2;--ink:#4a2a14;--text:#3b2413;--mut:#8f7458;--line:#eadcc4;--pri:#c8642a;--pri-d:#a14c1b;--pri-t:rgba(200,100,42,.12);--dot:#d8c3a2}
body.mint{--bg:#eef7f4;--surface:#fff;--ink:#0f3b35;--text:#0f2e2a;--mut:#5f7d77;--line:#d9ebe5;--pri:#0f9d82;--pri-d:#0a7a65;--pri-t:rgba(15,157,130,.12);--dot:#b9d4cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background-color .3s;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;border:none;background:none;padding:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.screen.active{opacity:1;visibility:visible}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;height:36px;padding:0 14px;font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.chip svg.i{width:18px;height:18px}
.coin{width:18px;height:18px;flex:none}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--text);transition:background .15s}
.ibtn:active{background:var(--line)}
[dir=rtl] .flip{transform:scaleX(-1)}

/* ---------- home ---------- */
#home{padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow-y:auto;align-items:center}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column}
.hbar{display:flex;justify-content:space-between;align-items:center}
.hero{display:flex;flex-direction:column;align-items:center;margin:6px 0 18px}
#demo{width:188px;height:188px;margin:4px 0 10px}
.title{margin:0;font-size:30px;font-weight:700;letter-spacing:-.4px}
.tag{margin:4px 0 0;color:var(--mut);font-size:15px}
.play{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--pri);color:#fff;border-radius:var(--r);
  padding:16px 18px;box-shadow:0 8px 20px -6px var(--pri);transition:transform .12s,background .15s;text-align:start}
.play:active{transform:scale(.98);background:var(--pri-d)}
.play b{display:block;font-size:20px;font-weight:600}
.play span{font-size:14px;opacity:.85}
.play .go{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.prog{height:4px;background:rgba(255,255,255,.22);border-radius:4px;margin-top:8px;overflow:hidden;width:150px}
.prog i{display:block;height:100%;background:#fff;border-radius:4px}
.sec{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:22px 4px 8px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;text-align:start;transition:background .15s}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--bg)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:16px}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--dot)}
.tagn{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--pri-t);color:var(--pri)}
.tagn.ok{background:rgba(22,163,74,.12);color:var(--green)}
.foot{text-align:center;margin-top:22px}
.foot a{color:var(--mut);font-size:13px;text-decoration:none}

/* ---------- game ---------- */
#game{padding-top:env(safe-area-inset-top)}
.top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:6px 8px 0}
.ttl{text-align:center;line-height:1.2}
.ttl b{font-size:18px;font-weight:600;display:block}
.ttl small{font-size:12.5px;color:var(--mut)}
.stats{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
.hearts{display:flex;gap:6px}
.hearts svg{width:26px;height:26px;transition:transform .3s}
.hearts .on{fill:var(--red);stroke:none}
.hearts .off{fill:none;stroke:var(--dot);stroke-width:2}
.hearts .hit{animation:hhit .5s}
@keyframes hhit{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}60%{transform:translateX(-3px)}100%{transform:none}}
#boardWrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;justify-content:center;gap:18px;padding:8px 0 max(18px,env(safe-area-inset-bottom))}
.tool{position:relative;width:60px;height:60px;border-radius:50%;background:var(--surface);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--line);
  display:grid;place-items:center;transition:transform .12s,background .15s,color .15s}
.tool:active{transform:scale(.92)}
.tool svg.i{width:26px;height:26px}
.tool.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{position:absolute;top:-3px;inset-inline-end:-5px;background:var(--pri);color:#fff;border-radius:999px;min-width:22px;height:22px;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 6px;border:2px solid var(--bg)}
.badge.buy{background:var(--gold);color:#3b2a00}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translate(-50%,-8px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;
  font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:45;display:flex;gap:8px;align-items:center}
#toast.show{opacity:.95;transform:translate(-50%,0)}
#toast svg.i{width:18px;height:18px}
#coach{position:absolute;inset-inline:16px;bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);
  font-size:14.5px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:2}
#coach.show{opacity:1;transform:none}
#coach .ico{width:34px;height:34px;border-radius:10px;background:var(--pri-t);color:var(--pri)}
#coach .ico svg{width:20px;height:20px}

/* ---------- sheets ---------- */
.ov{position:fixed;inset:0;background:rgba(10,14,30,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px;
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.show{opacity:1;visibility:visible}
.box{background:var(--surface);border-radius:24px;padding:24px 20px 18px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2);
  transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-height:92vh;overflow-y:auto}
.ov.show .box{transform:none}
.box h3{margin:4px 0 4px;font-size:22px;font-weight:700}
.box p{color:var(--mut);margin:4px 0;font-size:15px}
.badgeIco{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center}
.badgeIco svg.i{width:32px;height:32px}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0 4px}
.stars svg{width:40px;height:40px;fill:var(--line);transition:fill .2s}
.stars svg.on{fill:var(--gold);animation:star .5s cubic-bezier(.3,1.6,.5,1) backwards}
.stars svg:nth-child(2){transform:translateY(-8px)}
.stars svg:nth-child(2).on{animation-name:star2}
@keyframes star{from{transform:scale(0) rotate(-40deg)}}
@keyframes star2{from{transform:translateY(-8px) scale(0) rotate(-40deg)}}
#thumb{width:150px;height:150px;border-radius:16px;margin:10px auto 6px;display:block;background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;margin:12px 0 4px}
.kpis div{padding:9px 4px}.kpis div+div{border-inline-start:1px solid var(--line)}
.kpis small{display:block;color:var(--mut);font-size:12px}
.kpis b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.b{border-radius:14px;padding:14px;font-weight:600;font-size:16px;background:var(--bg);color:var(--text);transition:transform .1s,background .15s}
.b.pri{background:var(--pri);color:#fff}
.b.pri:active{background:var(--pri-d)}
.b.gold{background:var(--gold);color:#3b2a00;display:flex;justify-content:center;align-items:center;gap:8px}
.price{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 9px 2px 4px;font-size:14px}
.b.ad{background:var(--pri-t);color:var(--pri);display:flex;align-items:center;justify-content:center;gap:8px}
.b.ad svg.i{width:18px;height:18px}
.b.gold svg.coin{width:18px;height:18px}
.b:disabled{opacity:.45}
.sel{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px;max-width:170px}
.lvnav{display:grid;grid-template-columns:42px 1fr 42px;align-items:center}
.lvnav b{display:block;font-size:20px;font-weight:700}.lvnav small{color:var(--mut);font-size:13px}
.ibtn:disabled{opacity:.25}
.lv{position:relative}.lv .shp{position:absolute;top:4px;inset-inline-end:4px;width:16px;height:16px}.lv:disabled .shp{position:static;width:26px;height:26px}.lv:disabled:has(.shp)::after{display:none}
#adfake{position:fixed;inset:0;background:#0b0b10;color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:17px}
#adfake button{background:#fff;color:#000;border-radius:999px;padding:10px 22px;font-weight:600}
.b.ghost{background:none;color:var(--mut)}
.b:active{transform:scale(.98)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);text-align:start;gap:10px;font-size:15px}
.set:last-of-type{border-bottom:none}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border-radius:8px;padding:6px 10px;font-weight:500;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sws{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pri)}
.tg{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.tg.on{background:var(--pri)}.tg.on::after{inset-inline-start:21px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.lv{background:var(--bg);border-radius:12px;aspect-ratio:1;font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.lv .ss{display:flex;gap:1px}.lv .ss svg{width:9px;height:9px;fill:var(--line)}.lv .ss svg.on{fill:var(--gold)}
.lv.cur{background:var(--pri);color:#fff}.lv.cur .ss svg{fill:rgba(255,255,255,.35)}
.lv:disabled{opacity:.4}
.lv:disabled::after{content:"";width:10px;height:10px;border:2px solid var(--mut);border-radius:3px;opacity:.6}
.big{font-size:52px;font-weight:700;color:var(--pri);margin:2px 0;font-variant-numeric:tabular-nums}
.how{text-align:start;margin-top:10px}
.how div{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14.5px;line-height:1.45}
.how .ico{width:34px;height:34px;border-radius:10px;background:var(--pri-t);color:var(--pri)}
.how .ico svg{width:19px;height:19px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:11;width:100%;height:100%}
a{color:var(--pri)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.6-4.5-9.5-9.3C1.1 7.7 3.4 4 7 4c2.1 0 3.9 1.2 5 2.9C13.1 5.2 14.9 4 17 4c3.6 0 5.9 3.7 4.5 7.2-1.9 4.8-9.5 9.3-9.5 9.3z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4l-5.8 3 1.1-6.4-4.7-4.6 6.5-.9z" stroke-linejoin="round"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5b000"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#c98a00" stroke-width="1.8"/><path d="M12 8.6v6.8" stroke="#c98a00" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<!-- HOME -->
<section id="home" class="screen active"><div class="wrap">
  <div class="hbar">
    <span class="chip"><svg class="coin"><use href="#i-coin"/></svg><span id="hCoins">0</span></span>
    <button class="ibtn" id="hSet" aria-label="settings" data-icon="gear"></button>
  </div>
  <div class="hero">
    <canvas id="demo"></canvas>
    <h1 class="title" data-t="title"></h1>
    <p class="tag" data-t="tagline"></p>
  </div>
  <button class="play" id="hPlay"><div><b data-t="play"></b><span id="hLvl"></span><div class="prog"><i id="hProg"></i></div></div><span class="go" data-icon="play"></span></button>
  <div class="sec" data-t="modes"></div>
  <div class="list">
    <button class="row" id="mDaily"><span class="ico" style="background:rgba(47,107,255,.12);color:#2f6bff" data-icon="cal"></span><span class="tx"><b data-t="daily"></b><small id="dailySub"></small></span><span id="dailyTag"></span><span class="chev flip" data-icon="chev"></span></button>
    <button class="row" id="mRush"><span class="ico" style="background:rgba(249,115,22,.12);color:#f97316" data-icon="watch"></span><span class="tx"><b data-t="rush"></b><small id="rushSub"></small></span><span class="chev flip" data-icon="chev"></span></button>
    <button class="row" id="mZen"><span class="ico" style="background:rgba(22,163,74,.12);color:#16a34a" data-icon="leaf"></span><span class="tx"><b data-t="zen"></b><small data-t="zenSub"></small></span><span class="chev flip" data-icon="chev"></span></button>
    <button class="row" id="mLevels"><span class="ico" style="background:rgba(124,58,237,.12);color:#7c3aed" data-icon="grid4"></span><span class="tx"><b data-t="levels"></b><small id="lvSub"></small></span><span class="chev flip" data-icon="chev"></span></button>
  </div>
  <div class="foot"><a href="privacy.html" data-t="privacy"></a></div>
</div></section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="top">
    <button class="ibtn" id="gBack" aria-label="back"><span class="flip" data-icon="back"></span></button>
    <div class="ttl"><b id="gTitle"></b><small id="gSub"></small></div>
    <button class="ibtn" id="gSet" aria-label="settings" data-icon="gear"></button>
  </div>
  <div class="stats">
    <span class="chip"><span data-icon="send"></span><span id="gLeft">0</span></span>
    <div class="hearts" id="gHearts"></div>
    <span class="chip" id="gRight"></span>
  </div>
  <div id="boardWrap"><canvas id="cv"></canvas><div id="toast"></div><div id="coach"><span class="ico" data-icon="hand"></span><span id="coachTx"></span></div></div>
  <div class="tools">
    <button class="tool" id="tHint" aria-label="hint"><span data-icon="bulb"></span><span class="badge" id="bHint"></span></button>
    <button class="tool" id="tBomb" aria-label="bomb"><span data-icon="bomb"></span><span class="badge" id="bBomb"></span></button>
    <button class="tool" id="tGrid" aria-label="grid"><span data-icon="hash"></span></button>
  </div>
</section>

<!-- WIN -->
<div class="ov" id="ovWin"><div class="box">
  <h3 id="wTitle"></h3>
  <p id="wSub"></p>
  <div class="stars" id="wStars"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
  <canvas id="thumb" width="300" height="300"></canvas>
  <div class="kpis"><div><small data-t="time"></small><b id="kTime"></b></div><div><small data-t="mistakesL"></small><b id="kMis"></b></div><div><small data-t="coins"></small><b id="kCoins"></b></div></div>
  <div class="btns"><button class="b ad" id="wDouble"></button><button class="b pri" id="wNext"></button><button class="b ghost" id="wHome" data-t="home"></button></div>
</div></div>

<!-- LOSE -->
<div class="ov" id="ovLose"><div class="box">
  <div class="badgeIco" style="background:rgba(239,68,68,.12);color:#ef4444" data-icon="heartx"></div>
  <h3 data-t="lose"></h3>
  <p data-t="loseSub"></p>
  <div class="btns"><button class="b ad" id="lAd"></button><button class="b gold" id="lCont"></button><button class="b pri" id="lRetry" data-t="retry"></button><button class="b ghost" id="lHome" data-t="home"></button></div>
</div></div>

<!-- RUSH END -->
<div class="ov" id="ovRush"><div class="box">
  <div class="badgeIco" style="background:rgba(249,115,22,.12);color:#f97316" data-icon="watch"></div>
  <h3 data-t="timeUp"></h3>
  <div class="big" id="rScore">0</div>
  <p id="rInfo"></p>
  <div class="btns"><button class="b ad" id="rMore"></button><button class="b pri" id="rAgain" data-t="again"></button><button class="b ghost" id="rHome" data-t="home"></button></div>
</div></div>

<!-- LEVELS -->
<div class="ov" id="ovLevels"><div class="box">
  <div class="lvnav"><button class="ibtn" id="lvPrev" aria-label="previous"><span class="flip" data-icon="back"></span></button><div><b id="lvTitle"></b><small id="lvRange"></small></div><button class="ibtn" id="lvNext" aria-label="next"><span class="flip" data-icon="chev"></span></button></div>
  <div class="lvgrid" id="lvGrid"></div>
  <div class="btns"><button class="b ghost" id="lvClose" data-t="close"></button></div>
</div></div>

<!-- GET MORE (hint / blast) -->
<div class="ov" id="ovGet"><div class="box">
  <div class="badgeIco" id="gIco" style="background:var(--pri-t);color:var(--pri)"></div>
  <h3 id="gHead"></h3>
  <div class="btns"><button class="b ad" id="gAd"></button><button class="b gold" id="gBuy"></button><button class="b ghost" id="gClose" data-t="close"></button></div>
</div></div>

<!-- SETTINGS -->
<div class="ov" id="ovSet"><div class="box">

const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // up,right,down,left as [dx,dy]
function rngOf(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const nxy=(r,c,R,C)=>[(c+.5)/C*2-1,(r+.5)/R*2-1]; // normalized, y down
function inPoly(x,y,P){let k=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)k=!k}return k}
const poly=P=>(r,c,R,C)=>{const[x,y]=nxy(r,c,R,C);return inPoly(x,y,P)};
const radial=(n,ro,ri,a0,dy)=>{const P=[];for(let i=0;i<n*2;i++){const a=a0+i*Math.PI/n,q=i%2?ri:ro;P.push([Math.cos(a)*q,Math.sin(a)*q+(dy||0)])}return P};
const fn=f=>(r,c,R,C)=>{const[x,y]=nxy(r,c,R,C);return f(x,y)};
const SHAPES={
  rect:()=>true,
  heart:(r,c,R,C)=>{const x=((c+.5)/C*2-1)*1.22,y=(1-(r+.5)/R*2)*1.3+.15;const a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0},
  circle:fn((x,y)=>x*x+y*y<=1.08),
  diamond:fn((x,y)=>Math.abs(x)+Math.abs(y)<=1.12),
  ring:fn((x,y)=>{const d=x*x+y*y;return d<=1.08&&d>=.16}),
  cross:fn((x,y)=>Math.abs(x)<.42||Math.abs(y)<.42),
  hourglass:fn((x,y)=>Math.abs(x)<=Math.abs(y)*1.05+.18),
  star:poly(radial(5,1.12,.5,-Math.PI/2,.1)),
  star8:fn((x,y)=>Math.max(Math.abs(x),Math.abs(y))<=.74||Math.abs(x)+Math.abs(y)<=1.05),
  hexagon:poly(radial(3,1.06,1.06,0).map(([x,y])=>[x,y*1.02])),
  house:poly([[0,-1.05],[1.06,-.12],[.78,-.12],[.78,1.04],[-.78,1.04],[-.78,-.12],[-1.06,-.12]]),
  tree:poly([[0,-1.06],[.55,-.45],[.32,-.45],[.8,.18],[.5,.18],[1.02,.72],[.2,.72],[.2,1.06],[-.2,1.06],[-.2,.72],[-1.02,.72],[-.5,.18],[-.8,.18],[-.32,-.45],[-.55,-.45]]),
  arrow:poly([[-1.04,-.36],[.12,-.36],[.12,-.95],[1.05,0],[.12,.95],[.12,.36],[-1.04,.36]]),
  crescent:fn((x,y)=>x*x+y*y<=1.08&&(x-.48)*(x-.48)+y*y>.5),
  smile:fn((x,y)=>{if(x*x+y*y>1.08)return false;const e=(ex)=>(x-ex)*(x-ex)+(y+.32)*(y+.32)<.045;if(e(.36)||e(-.36))return false;const d=x*x+(y-.02)*(y-.02);return!(y>.18&&d>.2&&d<.42)}),
  cat:fn((x,y)=>{const h=x*x/.95+(y-.18)*(y-.18)/.72<=1;const ear=inPoly(x,y,[[-.9,-.12],[-.8,-1.06],[-.22,-.55]])||inPoly(x,y,[[.9,-.12],[.8,-1.06],[.22,-.55]]);return h||ear}),

  frame:fn((x,y)=>{const m=Math.max(Math.abs(x),Math.abs(y));return m<=1.05&&m>=.42}),
  drop:fn((x,y)=>{if(x*x+(y-.3)*(y-.3)<=.55)return true;return y<=.3&&y>=-1.06&&Math.abs(x)<=(y+1.06)*.55}),

const ASPECT={heart:1,arrow:.85,butterfly:.9,cat:1,smile:1,circle:1,ring:1,flower:1,star:1,star8:1,hexagon:1,frame:1};
const SHAPE_ORDER=['heart','diamond','star','circle','house','cross','hexagon','tree','ring','smile','arrow','crescent','star8','cat','flower','hourglass','frame','drop','butterfly','triangle','plus'];
function generate(rng,cfg){
  const R=cfg.rows,C=cfg.cols,N=R*C,valid=new Uint8Array(N),occ=new Int16Array(N).fill(-1),arrows=[];
  const m=SHAPES[cfg.mask]||SHAPES.rect;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)valid[r*C+c]=m(r,c,R,C)?1:0;
  const ri=n=>Math.floor(rng()*n);
  const free=i=>valid[i]&&occ[i]<0;
  function tryPlace(h,d,target,minL){
    const r=h/C|0,c=h%C,[dx,dy]=DIRS[d];
    const ray=new Set();
    for(let y=r+dy,x=c+dx;y>=0&&y<R&&x>=0&&x<C;y+=dy,x+=dx){const i=y*C+x;if(occ[i]>=0)return false;ray.add(i)}
    let cy=r-dy,cx=c-dx;
    if(cy<0||cy>=R||cx<0||cx>=C)return false;
    let p=cy*C+cx;if(!free(p)||ray.has(p))return false;
    const body=[h,p],used=new Set(body);let wd=(d+2)%4;
    while(body.length<target){
      const opts=[];let tw=0;
      for(const nd of [wd,(wd+1)%4,(wd+3)%4]){
        const ny=cy+DIRS[nd][1],nx2=cx+DIRS[nd][0];
        if(ny<0||ny>=R||nx2<0||nx2>=C)continue;
        const i=ny*C+nx2;if(!free(i)||used.has(i)||ray.has(i))continue;
        const w=nd===wd?cfg.straight:1;opts.push([nd,i,w]);tw+=w;
      }
      if(!opts.length)break;
      let k=rng()*tw,o=opts[0];for(const q of opts){k-=q[2];if(k<=0){o=q;break}}
      wd=o[0];cy+=DIRS[wd][1];cx+=DIRS[wd][0];body.push(o[1]);used.add(o[1]);
    }
    if(body.length<minL)return false;
    const id=arrows.length,cells=body.reverse();
    for(const i of cells)occ[i]=id;
    arrows.push({id,cells,dir:d});
    return true;
  }
  let fails=0;
  while(fails<220){
    const fr=[];for(let i=0;i<N;i++)if(free(i))fr.push(i);
    if(!fr.length)break;
    const h=fr[ri(fr.length)],ds=[0,1,2,3].sort(()=>rng()-.5),tgt=cfg.minL+ri(cfg.maxL-cfg.minL+1);
    let ok=false;for(const d of ds)if(tryPlace(h,d,tgt,Math.min(tgt,cfg.minL+1))){ok=true;break}
    fails=ok?0:fails+1;
  }
  // fill pass: plug remaining holes with whatever fits
  const order=[];for(let i=0;i<N;i++)order.push(i);order.sort(()=>rng()-.5);
  for(const i of order)if(free(i))for(const d of [0,1,2,3].sort(()=>rng()-.5))if(tryPlace(i,d,cfg.maxL,2))break;
  // locks & keys: placement order is a valid reverse-removal order, so key must have a higher index than its lock
  const n=arrows.length,taken=new Set();let pid=0;
  for(let tries=0;pid<cfg.locks&&tries<200;tries++){
    const li=ri(Math.floor(n*.7)),ki=li+1+ri(n-li-1);
    if(ki>=n||taken.has(li)||taken.has(ki)||arrows[li].cells.length<3||arrows[ki].cells.length<2)continue;
    arrows[li].lock=pid;arrows[ki].key=pid;taken.add(li);taken.add(ki);pid++;
  }
  for(let g=0,tries=0;g<cfg.gold&&tries<100;tries++){const i=ri(n);if(!taken.has(i)){arrows[i].gold=1;taken.add(i);g++}}
  return {rows:R,cols:C,valid,arrows};
}

function levelCfg(n){
  const E=[[4,5,2,3],[5,6,2,3],[5,7,2,4],[6,8,2,4],[6,8,2,5]];
  if(n<=E.length){const [c,r,a,b]=E[n-1];return{cols:c,rows:r,minL:a,maxL:b,locks:n===5?1:0,gold:n>2?1:0,mask:'rect',straight:2.5}}
  let cols=Math.min(6+Math.floor((n-5)/5),13),rows=Math.round(cols*1.4),mask='rect';
  if(n%5===0){mask=SHAPE_ORDER[(n/5-2)%SHAPE_ORDER.length];cols=Math.max(12,Math.min(cols+4,15));rows=Math.round(cols*(ASPECT[mask]||1.15))}
  return{cols,rows,mask,minL:n>=40?3:2,maxL:Math.min(4+Math.floor((n-5)/4),12),locks:n<8?0:Math.min(1+Math.floor((n-8)/9),4),gold:1+n%2,straight:2+(n%3)*.8};
}

let toastT;

let lvPage=0;const shpCache={};
function shapeIcon(m){const k=m+S.theme;if(shpCache[k])return shpCache[k];const c=document.createElement('canvas'),n=11;c.width=c.height=44;const x=c.getContext('2d');x.fillStyle=COL.pri;
  for(let r=0;r<n;r++)for(let q=0;q<n;q++)if(SHAPES[m](r,q,n,n)){x.fillRect(q*4,r*4,4.2,4.2)}return shpCache[k]=c.toDataURL()}
function renderLevels(){

/* ================= effects ================= */
function burst(x,y,cols,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp+1;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,life:.5+Math.random()*.4,col:cols[i%cols.length],s:Math.random()*2.5+1.5})}}
const rings=[];function ring(x,y,col){rings.push({x,y,col,t0:performance.now()})}
function floatText(text,x,y,col,coin,size){floats.push({text,x,y,col,coin,size:size||17,t0:performance.now()})}
function drawFx(c,now){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=1/60;if(p.life<=0){parts.splice(i,1);continue}
    p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.97;c.globalAlpha=clamp(p.life*2,0,1);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill()}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i],p=(now-r.t0)/500;if(p>1){rings.splice(i,1);continue}
    c.globalAlpha=1-p;c.strokeStyle=r.col;c.lineWidth=3*(1-p)+1;c.beginPath();c.arc(r.x,r.y,GV.cs*(.3+p*1.1),0,7);c.stroke()}
  c.textAlign='center';c.textBaseline='middle';
  for(let i=floats.length-1;i>=0;i--){const f=floats[i],p=(now-f.t0)/900;if(p>1){floats.splice(i,1);continue}
    const y=f.y-p*30;c.globalAlpha=p<.75?1:1-(p-.75)/.25;c.font=`600 ${f.size}px Rubik,system-ui,sans-serif`;
    const w=c.measureText(f.text).width,pw=w+(f.coin?34:22),ph=f.size+12;
    c.fillStyle=COL.surface;c.beginPath();c.roundRect?c.roundRect(f.x-pw/2,y-ph/2,pw,ph,ph/2):c.rect(f.x-pw/2,y-ph/2,pw,ph);c.fill();
    c.strokeStyle=COL.line;c.lineWidth=1;c.stroke();
    let tx=f.x;if(f.coin){const cx=f.x-pw/2+14;c.fillStyle=COL.gold;c.beginPath();c.arc(cx,y,6.5,0,7);c.fill();tx+=8}
    c.fillStyle=f.col===COL.gold?'#b07a00':f.col;c.fillText(f.text,tx,y+1)}
  c.globalAlpha=1;
}
const fxc=$('#fx'),fctx=fxc.getContext('2d');let conf=[],fxDirty=false;
function sizeFx(){const d=Math.min(window.devicePixelRatio||1,3);fxc.width=innerWidth*d;fxc.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
function confetti(){const C=['#2f6bff','#f5b000','#16a34a','#e8455a','#7c3aed'];
  for(let i=0;i<70;i++)conf.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*1.5,vy:2+Math.random()*2.5,r:Math.random()*6,vr:(Math.random()-.5)*.2,w:Math.random()*.8+.2,c:C[i%5]})}
function drawConf(){fctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=conf.length-1;i>=0;i--){const p=conf[i];p.x+=p.vx+Math.sin(p.y/40)*.6;p.y+=p.vy;p.r+=p.vr;if(p.y>innerHeight+20){conf.splice(i,1);continue}
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.scale(Math.cos(p.r*2),1);fctx.fillStyle=p.c;fctx.fillRect(-3,-5,6,10);fctx.restore()}}

/* ================= audio & haptics ================= */
let AC=null,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,f2,delay){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(d,f1,f2,v,q){const a=ac();if(!a)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const x=NB.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1}
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t0=a.currentTime;s.buffer=NB;f.type='bandpass';f.Q.value=q||1.2;
  f.frequency.setValueAtTime(f1,t0);f.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+d*.3);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f).connect(g).connect(a.destination);s.start(t0);s.stop(t0+d)}
function sfx(n,k){if(!S.sound)return;
  switch(n){
    case'whoosh':{const m=Math.pow(1.05,Math.min(k||1,12));noise(.2,500*m,2600*m,.35);tone(520*m,.08,'sine',.04,780*m);break}
    case'bump':tone(160,.16,'sine',.22,70);noise(.08,300,200,.12,2);break;
    case'lock':tone(1100,.04,'square',.03);tone(900,.05,'square',.03,null,.06);break;
    case'unlock':tone(990,.12,'sine',.08);tone(1480,.2,'sine',.07,null,.08);break;
    case'hint':tone(740,.15,'sine',.07);tone(1110,.22,'sine',.06,null,.1);break;
    case'boom':noise(.45,900,120,.5,.7);tone(110,.35,'sine',.2,45);break;
    case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.5,'sine',.07,null,i*.09));break;
    case'lose':[392,330,262].forEach((f,i)=>tone(f,.4,'sine',.08,null,i*.16));break;
  }}
function vib(p){if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* ================= ads (AdMob through the Capacitor plugin) ================= */
// Google's official TEST unit IDs. Replace them with your own AdMob unit IDs before publishing.
const AD_UNITS={interstitial:'ca-app-pub-3940256099942544/1033173712',rewarded:'ca-app-pub-3940256099942544/5224354917'};
const Ads={native:null,test:/[?&]ads=test/.test(location.search),busy:false,last:0,boards:0,
  async init(){const C=window.Capacitor,P=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.AdMob;if(!P)return;
    try{await P.initialize({});
      try{const c=await P.requestConsentInfo();if(c.isConsentFormAvailable&&c.status==='REQUIRED')await P.showConsentForm()}catch(e){}
      this.native=P;this.load('i');this.load('r');
      try{const c=await P.requestConsentInfo();if(c.privacyOptionsRequirementStatus==='REQUIRED'||c.isConsentFormAvailable)$('#sAdPriv').style.display=''}catch(e){}}catch(e){}},
  ok(){return!!this.native||this.test},
  load(k){const P=this.native;if(!P)return;(k==='i'?P.prepareInterstitial({adId:AD_UNITS.interstitial}):P.prepareRewardVideoAd({adId:AD_UNITS.rewarded})).catch(()=>{})},
  // Between levels only, never before level 7, at most once every 3 boards and 2.5 minutes.
  async interstitial(){this.boards++;
    if(!this.ok()||this.busy||S.level<7||this.boards<3||Date.now()-this.last<150000)return;
    this.busy=true;try{if(this.native){await this.native.showInterstitial();this.load('i')}else await fakeAd(false)}catch(e){}
    this.busy=false;this.boards=0;this.last=Date.now()},
  // Resolves true only when the player earned the reward.
  rewarded(){return new Promise(async done=>{
    if(!this.ok()||this.busy)return done(false);this.busy=true;
    const fin=v=>{this.busy=false;if(v){this.last=Date.now();this.boards=0}done(v)};
    if(!this.native){fin(await fakeAd(true));return}
    const P=this.native,hs=[];let got=false,ended=false;
    const end=()=>{if(ended)return;ended=true;hs.forEach(h=>h&&h.remove&&h.remove());this.load('r');setTimeout(()=>fin(got),300)};
    try{hs.push(await P.addListener('onRewardedVideoAdReward',()=>{got=true}));
      hs.push(await P.addListener('onRewardedVideoAdDismissed',end));
      hs.push(await P.addListener('onRewardedVideoAdFailedToShow',end));
      const r=await P.showRewardVideoAd();if(r&&r.amount!=null)got=true}catch(e){end()}})}
};
// Stand-in ad used only in the browser with ?ads=test, to try the ad flows without a phone.
function fakeAd(rewarded){return new Promise(res=>{const d=document.createElement('div');d.id='adfake';let n=3;
  d.innerHTML=`<div style="opacity:.6;font-size:13px">TEST AD · ${rewarded?'rewarded':'interstitial'}</div><div id="adN" style="font-size:42px;font-weight:700">${n}</div><button style="visibility:hidden">✕</button>`;
  document.body.appendChild(d);const iv=setInterval(()=>{n--;d.querySelector('#adN').textContent=n;if(n<=0){clearInterval(iv);const b=d.querySelector('button');b.style.visibility='visible';b.onclick=()=>{d.remove();res(true)}}},1000)})}

/* ================= home demo ================= */
let demoNext=0,demoEnd=0;
function demoNew(){DV.size();DV.set(makeBoard(generate(rngOf(Math.random()*1e9|0),{cols:5,rows:5,mask:'rect',minL:2,maxL:4,locks:0,gold:0,straight:2})));
  demoNext=performance.now()+1300;demoEnd=0}
function demoStep(now){
  const B=DV.B;if(!B)return;
  if(now>demoNext&&B.left>0){const f=freeArrows(B);if(f.length)launch(DV,f[Math.floor(Math.random()*f.length)],now);demoNext=now+520;if(B.left===0)demoEnd=now+1100}
  if(demoEnd&&now>demoEnd)demoNew();
  drawBoard(DV,now,{});

/* ================= loop ================= */
function loop(now){
  if($('#home').classList.contains('active'))demoStep(now);
  else if(G&&$('#game').classList.contains('active')){
    drawBoard(GV,now,{grid:S.grid,preview,press:press&&press.id>=0?press.id:null,hint:G.hint,coach});
    drawFx(GV.c,now);
    if(G.mode==='rush'&&R&&!G.over){const l=Math.max(0,R.end-now),s=Math.ceil(l/1000);
      const txt=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(R.txt!==txt){R.txt=txt;$('#gHearts').innerHTML=`<span class="chip" style="color:${s<=10?'var(--red)':'inherit'}">${ico('watch')}${txt}</span>`}
      if(R.sc!==R.score){R.sc=R.score;$('#gRight').innerHTML=`${ico('star')}${R.score}`}
      if(l<=0)rushOver()}
  }
  if(conf.length){drawConf();fxDirty=true}else if(fxDirty){fctx.clearRect(0,0,innerWidth,innerHeight);fxDirty=false}
  requestAnimationFrame(loop);
}

/* ================= input ================= */
const cv=$('#cv');
cv.addEventListener('pointerdown',e=>{
  if(!G||G.over)return;ac();
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,id=hit(x,y);
  press={id,x,y,long:false,timer:id>=0?setTimeout(()=>{if(press&&press.id===id){press.long=true;preview=id;vib(6)}},360):0}});
cv.addEventListener('pointermove',e=>{if(!press||press.long)return;const r=cv.getBoundingClientRect();
  if(Math.hypot(e.clientX-r.left-press.x,e.clientY-r.top-press.y)>14){clearTimeout(press.timer);press.id=-1}});
function endPress(fire){if(!press)return;clearTimeout(press.timer);const p=press;press=null;preview=null;
  if(fire&&!p.long&&p.id>=0&&G&&G.arrows[p.id].alive)tap(p.id)}
