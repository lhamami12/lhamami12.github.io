<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="City Driver 3D — drive through city traffic: missions, traffic lights, overtaking, fuel and parking. / قيادة في زحمة المدينة.">
<title>City Driver 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(12,18,32,.78);--line:rgba(255,255,255,.13);--txt:#f1f5f9;--mut:#94a3b8;--acc:#ffb703;--acc2:#fb8500;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:var(--txt);
  font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hide{display:none!important}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.tl,.tr{position:absolute;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.tl{left:calc(10px + env(safe-area-inset-left))}
.tr{right:calc(10px + env(safe-area-inset-right))}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px}
.ib:active{transform:scale(.92)}
.chips{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:5px;align-items:center;width:max-content;max-width:calc(100vw - 120px)}
.chip{padding:3px 10px;border-radius:12px;font-weight:800;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:5px;height:32px}
.chip.warn{color:#fecaca;border-color:var(--bad)}
.dmg{display:flex;gap:3px}
.dmg i{width:7px;height:14px;border-radius:3px;background:rgba(255,255,255,.2)}
.dmg i.on{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.fuel{width:54px;height:9px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;direction:ltr}
.fuel i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#facc15 35%,#22c55e)}
#prog{position:absolute;top:calc(52px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(52vw,260px);height:6px;border-radius:4px;background:rgba(0,0,0,.35);direction:ltr}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#ffc933,#fb8500)}
#prog b{position:absolute;right:-7px;top:-6px;font-size:13px}
#tlight{position:absolute;top:calc(84px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:30px;padding:5px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#111827;border:2px solid #374151}
#tlight i{width:18px;height:18px;border-radius:50%;background:#2b2f36}
#tlight i.r.on{background:#ff3b30;box-shadow:0 0 10px #ff3b30}#tlight i.y.on{background:#ffcc00;box-shadow:0 0 10px #ffcc00}#tlight i.g.on{background:#34c759;box-shadow:0 0 10px #34c759}
#tlight small{font-size:10px;font-weight:800;color:#e5e7eb;line-height:1}
#limit{position:absolute;top:calc(84px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid #e11d48;color:#111;display:grid;place-items:center;font-weight:900;font-size:16px;direction:ltr}
#limit.over{animation:blink .5s infinite}
@keyframes blink{50%{transform:scale(1.15)}}
#hold{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:6px 16px 6px 8px;border-radius:999px;font-weight:800;font-size:15px;white-space:nowrap}
#hold svg{width:36px;height:36px;transform:rotate(-90deg)}
#hold circle{fill:none;stroke-width:4}
#hold .bg{stroke:rgba(255,255,255,.18)}
#hold #ring{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:100.5;stroke-dashoffset:100.5}
#banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;padding:14px 26px;border-radius:20px;
  transition:opacity .5s,transform .5s;opacity:0;min-width:240px;max-width:88vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .n{font-size:13px;color:var(--acc);font-weight:800;letter-spacing:1px}
#banner .t{font-size:26px;font-weight:900;line-height:1.3}
#banner .h{font-size:15px;color:#dbe4ef}
#banner .p{font-size:12px;color:var(--mut);margin-top:2px}
#count{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:84px;font-weight:900;color:#fff;text-shadow:0 4px 0 #9a4f00,0 0 30px rgba(0,0,0,.6);pointer-events:none}

.ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.ctrl>*{pointer-events:auto}
#wheel{width:150px;height:150px;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#wheel svg{width:100%;height:100%;display:block}
.cluster{display:flex;align-items:flex-end;gap:10px}
#wheel{flex-shrink:0}
@media (orientation:portrait){.cluster{position:relative}#bHorn{position:absolute;bottom:100%;left:0;margin-bottom:12px}}
@media (orientation:portrait) and (max-width:380px){#wheel{width:128px;height:128px}}
.gear{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;margin-bottom:4px}
.gear button{width:46px;height:44px;font-weight:900;font-size:19px;color:var(--mut);touch-action:none}
.gear button.on{background:linear-gradient(#ffc933,#fb8500);color:#241500}
.gear button.on.r{background:linear-gradient(#ff7a7a,#dc2626);color:#fff}
.pedal{touch-action:none;border-radius:14px;background:linear-gradient(#69737f,#2b313a);box-shadow:0 5px 0 #0f1318,inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;transition:transform .06s,box-shadow .06s}
.pedal::before{content:'';position:absolute;inset:22px 9px 9px;border-radius:8px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 4px,rgba(255,255,255,.06) 4px 9px)}
.pedal span{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#e5e7eb}
.pedal.on{transform:translateY(4px) scaleY(.97);box-shadow:0 1px 0 #0f1318;filter:brightness(1.15)}
.brake{width:84px;height:76px}
.gasp{width:64px;height:122px}
#bHorn{width:52px;height:52px;border-radius:50%;font-size:22px;margin-bottom:4px;touch-action:none}
#bHorn.on{transform:scale(.9);background:rgba(255,183,3,.5)}
.pad{width:74px;height:74px;border-radius:50%;font-size:28px;font-weight:900;display:grid;place-items:center;touch-action:none;color:#fff}
.pad.on{transform:scale(.93);background:rgba(255,183,3,.5)}
.pads{display:flex;gap:12px}
.pad.fw{background:rgba(34,197,94,.8)} .pad.bk{background:rgba(239,68,68,.8)}
#speedo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;padding:6px 14px 8px;border-radius:16px;min-width:100px}
#speedo b{font-size:30px;line-height:1;display:block;font-weight:900}
#speedo small{font-size:11px;color:var(--mut)}
#speedo .g{font-weight:900;color:var(--acc);margin-inline-start:6px;font-size:14px}
.sensor{display:flex;gap:3px;justify-content:center;margin-top:5px;direction:ltr}
.sensor i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.sensor i.g{background:var(--ok)} .sensor i.y{background:var(--acc)} .sensor i.r{background:var(--bad)}
@media (orientation:portrait){#speedo{bottom:calc(178px + env(safe-area-inset-bottom))}}
@media (max-height:430px){#wheel{width:124px;height:124px}.gasp{height:100px}.brake{height:64px;width:76px}#tlight,#limit{top:calc(64px + env(safe-area-inset-top))}}
#flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 110px 30px rgba(239,68,68,.85);opacity:0;transition:opacity .35s;z-index:11}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;touch-action:pan-y}
.screen.dim{background:rgba(5,10,20,.55)}
.panel{width:100%;max-width:460px;border-radius:24px;padding:20px;text-align:center;margin:auto}
.screen.main{align-items:flex-end;background:linear-gradient(transparent 45%,rgba(5,10,20,.75))}
.screen.main .panel{margin:0 auto;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
@media (orientation:landscape){.screen.main{align-items:center;justify-content:flex-start;background:linear-gradient(-90deg,rgba(5,10,20,.8),transparent 60%)}
  [dir=ltr] .screen.main{background:linear-gradient(90deg,rgba(5,10,20,.8),transparent 60%)}
  .screen.main .panel{margin:0;max-width:340px}}
.logo{direction:ltr;margin-bottom:6px}
.logo .l1{font-size:42px;font-weight:900;letter-spacing:2px;line-height:1.05;background:linear-gradient(#fff 20%,#ffd36b 60%,#fb8500);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.logo .l1 sup{font-size:20px;letter-spacing:0}
.logo .l2{font-size:20px;font-weight:800;color:#e2e8f0;text-shadow:0 2px 6px #000}
#bLang{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline-end:calc(12px + env(safe-area-inset-right));width:auto;padding:0 14px;font-weight:900;font-size:15px;z-index:21}
h2{margin:0 0 12px;font-size:24px;font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:16px;font-weight:900;font-size:18px;margin-top:10px;
  background:rgba(255,255,255,.1);border:1px solid var(--line);color:#fff}
.btn.pri{background:linear-gradient(180deg,#ffc933,#fb8500);color:#241500;border:0;box-shadow:0 5px 0 #9a4f00;font-size:21px}
.btn:active{transform:translateY(2px)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:6px}
@media (max-width:380px){.panel{padding:16px 12px}}
.lv{border-radius:14px;padding:6px 2px 5px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:900;font-size:20px;line-height:1.1}
.lv small{display:block;font-size:15px;line-height:1.2}
.lv .st{display:block;font-size:11px;color:var(--acc);letter-spacing:1px}
.lv.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.lv:disabled{opacity:.4}
@media (max-height:560px){.lv{padding:3px 2px}.lv small{display:inline;font-size:12px}.levels{gap:4px}}
.total{color:var(--acc);font-weight:800;margin-bottom:6px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:-4px 0 6px;font-weight:900}
.pager .ib{width:38px;height:34px;font-size:15px}.pager .ib:disabled{opacity:.3}
.lv small i{font-style:normal;font-size:11px}
.carsel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.cname{font-size:22px;font-weight:900;line-height:1.2}
.lock{font-size:13px;color:var(--acc);font-weight:800;min-height:18px}
.cstats{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center;font-size:13px;font-weight:800;margin-bottom:8px;text-align:start}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ffc933,#fb8500)}
@media (max-height:500px){#sGarage h2{font-size:18px;margin-bottom:2px}#sGarage .carsel{margin:0 0 4px}#sGarage .ib{width:38px;height:38px}
  .cname{font-size:18px}.cstats{gap:2px 10px;margin-bottom:4px}#sGarage .sw{gap:8px;margin:4px 0}#sGarage .sw button{width:32px;height:32px}
  #sGarage .btn{padding:8px;margin-top:6px}#sGarage .panel{padding:12px 16px}}
#coinChip{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline-start:calc(12px + env(safe-area-inset-left));z-index:21;font-size:16px;color:#ffd36b}
.earn{font-size:24px;font-weight:900;color:#ffd36b;margin:2px 0 4px;direction:ltr}
#bBuy{margin:0 0 8px;padding:9px}
.ups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 8px}
.ups button{border-radius:12px;padding:5px 2px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:12px;line-height:1.35}
.ups button b{display:block;font-size:11px;letter-spacing:2px;color:var(--acc);direction:ltr}
.ups button span{display:block;font-size:12px;color:#ffd36b}
.ups button.poor{opacity:.55}.ups button.max span{color:var(--ok)}
.ups button.flash{animation:upf .5s}
@keyframes upf{40%{transform:scale(1.08);background:rgba(34,197,94,.35)}}
.bar i.up{background:linear-gradient(90deg,#22c55e,#86efac)}
@media (max-height:500px){.ups{margin:0 0 4px}.ups button{padding:2px}}
.btn.ad{background:linear-gradient(180deg,#34d399,#059669);border:0;box-shadow:0 4px 0 #04603f;padding:10px}
#bFreeCoins{margin:0 0 8px}
#bEndless{background:linear-gradient(180deg,#38bdf8,#1d4ed8);border:0;box-shadow:0 4px 0 #1e3a8a}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:4px 0 10px;direction:ltr}
.days div{border-radius:12px;padding:6px 1px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:11px;line-height:1.3}
.days b{display:block;font-size:15px;color:#ffd36b}
.days .done{opacity:.45}.days .today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:rgba(255,183,3,.16);transform:scale(1.06)}
#toast{position:fixed;left:50%;bottom:calc(32% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:rgba(12,18,32,.92);color:#fff;
  padding:10px 18px;border-radius:14px;font-weight:800;max-width:86vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#toast.bad{background:rgba(185,28,28,.92)}
#adfake{position:fixed;inset:0;z-index:70;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif}
#adfake button{background:#fff;color:#111;border-radius:50%;width:44px;height:44px;font-size:20px}
#bBuy.poor{filter:grayscale(.7) brightness(.8)}
.lock.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sw{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0 6px}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.25);box-shadow:inset 0 -6px 10px rgba(0,0,0,.35)}
.sw button.on{border-color:var(--acc);transform:scale(1.12)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px}
.seg button{padding:6px 10px;border-radius:9px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#241500}
.stars{font-size:52px;letter-spacing:6px;margin:4px 0;direction:ltr}
.stars span{display:inline-block;opacity:.18;filter:grayscale(1);transform:scale(.6);transition:all .35s cubic-bezier(.3,1.8,.5,1)}
.stars span.on{opacity:1;filter:none;transform:scale(1)}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:8px 0}
.stats div{background:rgba(255,255,255,.07);border-radius:14px;padding:6px 12px;font-weight:800}
.stats small{display:block;color:var(--mut);font-size:12px}
.mut{color:var(--mut);font-size:14px}
.how{font-size:13px;color:#cbd5e1;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px;margin-top:12px;line-height:1.7}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(#16213a,#070b14);transition:opacity .5s}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:14px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>

<div id="hud" class="hide" dir="ltr">
  <div class="tl"><button class="ib glass" id="bPause" aria-label="Pause">❚❚</button></div>
  <div class="chips">
    <div class="chip glass" id="cLvl">1/20</div>
    <div class="chip glass" id="cTime">⏱ <span id="time">0</span></div>
    <div class="chip glass" id="cGoal"><span id="goalIco">🏁</span><span id="goal"></span><div class="fuel hide" id="fuelBar"><i id="fuelFill"></i></div></div>
    <div class="chip glass"><span>🔧</span><div class="dmg" id="dmg"><i></i><i></i><i></i></div></div>
  </div>
  <div id="prog"><i id="progFill"></i><b>🏁</b></div>
  <div class="tr"><button class="ib glass" id="bCam" aria-label="Camera">🎥</button></div>
  <div id="tlight" class="hide"><i class="r"></i><i class="y"></i><i class="g"></i><small id="tlDist"></small></div>
  <div id="limit" class="hide">50</div>
  <div id="hold" class="glass hide">
    <svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle id="ring" cx="20" cy="20" r="16"/></svg>
    <span id="holdLbl"></span>
  </div>
  <div id="banner" class="glass"><div class="n" id="bnN"></div><div class="t" id="bnT"></div><div class="h" id="bnH"></div><div class="p" id="bnP"></div></div>
  <div id="count" class="hide"></div>
  <div id="speedo" class="glass"><b id="kmh">0</b><small>km/h</small><span class="g" id="gearLbl">D</span>
    <div class="sensor hide" id="sensor"><i></i><i></i><i></i><i></i><i></i></div></div>

  <div class="ctrl" id="ctrlWheel">
    <div id="wheel">
      <svg viewBox="-50 -50 100 100">
        <defs>
          <radialGradient id="hub" cx="40%" cy="35%"><stop offset="0" stop-color="#5b6470"/><stop offset="1" stop-color="#1c2027"/></radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a414b"/><stop offset="1" stop-color="#121519"/></linearGradient>
        </defs>
        <g id="wheelG">
          <circle r="42" fill="none" stroke="url(#rim)" stroke-width="11"/>
          <circle r="42" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
          <path d="M-36 6 L-12 4 L-8 14 L8 14 L12 4 L36 6 L36 -2 L12 -4 L-12 -4 L-36 -2Z" fill="#262b33"/>
          <path d="M-7 12 L-5 36 L5 36 L7 12Z" fill="#262b33"/>
          <circle r="13" fill="url(#hub)" stroke="#0d0f12" stroke-width="1.5"/>
          <text y="4.5" text-anchor="middle" font-size="10" font-weight="900" fill="#ffb703" font-family="Cairo,sans-serif">CD</text>
          <rect x="-3" y="-48" width="6" height="11" rx="2" fill="#ffb703"/>
        </g>
      </svg>
    </div>
    <div class="cluster">
      <button class="glass hold" id="bHorn" data-k="horn" aria-label="Horn">📯</button>
      <div class="gear glass"><button id="gD" class="on">D</button><button id="gR" class="r">R</button></div>
      <button class="pedal brake hold" data-k="brake" aria-label="Brake"><span data-i18n="brake"></span></button>
      <button class="pedal gasp hold" data-k="gas" aria-label="Gas"><span data-i18n="gas"></span></button>
    </div>
  </div>

  <div class="ctrl hide" id="ctrlArrows">
    <div class="pads"><button class="pad glass hold" data-k="left">◀</button><button class="pad glass hold" data-k="right">▶</button></div>
    <div class="pads"><button class="pad bk hold" data-k="back">▼</button><button class="pad fw hold" data-k="fwd">▲</button></div>
  </div>
</div>
<div id="flash"></div>

function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const R = Math.random;
function speckle(g, w, h, n, a) {
  for (let i = 0; i < n; i++) {
    const v = R() < .5 ? 255 : 0;
    g.fillStyle = `rgba(${v},${v},${v},${R() * a})`;
    g.fillRect(R() * w, R() * h, 1 + R() * 2, 1 + R() * 2);
  }
}

/* Merge many transformed geometries into one, so a whole level draws in a few calls */
const WHITE = new THREE.Color(1, 1, 1);
function merge(parts, withColor = false) {
  const P = [], N = [], U = [], C = [];
  for (const p of parts) {
    const g = (p.g.index ? p.g.toNonIndexed() : p.g.clone()).applyMatrix4(p.m);
    const n = g.attributes.position.count;
    P.push(g.attributes.position.array); N.push(g.attributes.normal.array);
    const uv = g.attributes.uv ? g.attributes.uv.array.slice() : new Float32Array(n * 2);
    if (p.uv) for (let i = 0; i < uv.length; i += 2) { uv[i] *= p.uv[0]; uv[i + 1] *= p.uv[1]; }
    U.push(uv);
    if (withColor) {
      const c = p.c || WHITE, col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      C.push(col);
    }
    g.dispose();
  }
  const cat = a => { const o = new Float32Array(a.reduce((s, x) => s + x.length, 0)); let k = 0; for (const x of a) { o.set(x, k); k += x.length; } return o; };
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(cat(P), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(cat(N), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(cat(U), 2));
  if (withColor) g.setAttribute('color', new THREE.BufferAttribute(cat(C), 3));
  return g;
}

if (!MODELS[save.car] || save.car >= NCARS) save.car = 0;
setPlayerModel(save.car);
applyLang();
applyColor();
applySettings();
syncSettings();
enterMenuWorld();
show('sMain');
setTimeout(maybeDaily, 900);
updateCam(0, true);
requestAnimationFrame(loop);
Ads.init();
// Android back button: pause while driving, otherwise step back through the menus
if (NATIVE && NATIVE.App) NATIVE.App.addListener('backButton', () => {
  if (Ads.busy) return;
  const open = SCREENS.find(id => !$('#' + id).classList.contains('hide'));
  if (state === 'play') pause();
  else if (open === 'sPause') resume();
  else if (open === 'sMain') NATIVE.App.exitApp();
  else if (open === 'sDaily') claimDaily(1);
  else if (open === 'sResult') goMenu('sLevels');
  else if (open) $(`#${open} [data-back]`).click();
});
window.game = { info: renderer.info, ads: Ads, car, startLevel, claimDaily, get Z1() { return Z1; }, get worldSize() { return world.children.length; }, get taxi() { return taxi; }, get rain() { return rainOn; }, get obstacles() { return obstacles.length; }, finish, LEVELS, get state() { return state; }, get traffic() { return traffic; }, get hits() { return hits; }, get fuel() { return fuel; }, get time() { return time; }, get overtakes() { return overtakes; }, get viol() { return viol; }, get INTS() { return INTS; }, setCam: m => { camMode = m; }, touch, keys,
  // test hooks: run the game faster than real time, with a callback before each step
  step(sec, fn) { for (let t = 0; t < sec; t += 1 / 30) { fn && fn(); tick(1 / 30); } }, phase: I => mainPhase(I), setWheel: a => { wheelAngle = a; }, get HL() { return HL; }, hitLog,
  // used by the scripts that draw the icon and store images
  camera, setTOD, setPlayerModel, holdCam: v => { camHold = v; }, P: () => P, freeze() { state = 'pause'; for (const c of traffic) c.g.visible = false; } };
</script>
