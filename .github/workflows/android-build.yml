# Builds the Bonbon Pop Android app (bonbon_pop_app/).
#
# - Always: a test APK you can install on a phone.
# - When the four ANDROID_* secrets are set: a signed .aab ready for Google Play.
#
# Download the results from the run page, section "Artifacts".
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'bonbon_pop_app/**'
      - 'match3/index.html'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bonbon_pop_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Copy the web game into the app assets
        run: ./tool/sync_game.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_* secrets not set: only a debug-signed test APK will be built (no .aab for Google Play)."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build test APK
        run: flutter build apk --release

      - name: Build Play Store bundle (.aab)
        if: env.SIGNED == 'true'
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: bonbon-pop-apk
          path: bonbon_pop_app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'true'
        with:
          name: bonbon-pop-aab
          path: bonbon_pop_app/build/app/outputs/bundle/release/app-release.aab

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

  # Installs the APK on an Android emulator and checks it starts without crashing.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bonbon-pop-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./bonbon_pop_app/tool/smoke_test.sh apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logs
          path: smoke/
