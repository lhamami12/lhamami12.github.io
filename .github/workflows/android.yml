# Builds the Arrow Escape Android app in the cloud, so no computer is needed.
# Every run produces:
#   - arrow-escape-test-apk : debug APK to install directly on a phone for testing
#   - arrow-escape-release  : signed AAB (upload to Google Play) + signed APK
# Signing uses the same 4 upload-key secrets as Bonbon Pop (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). To give Arrow Escape
# its own key instead, add the same four secrets prefixed with ARROW_ (ARROW_KEYSTORE_BASE64, ...).
name: Arrow Escape build

on:
  push:
    paths:
      - 'arrows/**'
      - 'arrows-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ARROW_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ARROW_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ARROW_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ARROW_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
      VERSION_NAME: '1.0'
    defaults:
      run:
        working-directory: arrows-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arrows-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and copy the game into the app
        run: |
          npm ci
          npm run sync

      - name: Build test APK
        working-directory: arrows-app/android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-test-apk
          path: arrows-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare upload key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB and APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: arrows-app/android
        run: |
          ./gradlew bundleRelease assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: arrow-escape-release
          path: |
            arrows-app/android/app/build/outputs/bundle/release/app-release.aab
            arrows-app/android/app/build/outputs/apk/release/app-release.apk
