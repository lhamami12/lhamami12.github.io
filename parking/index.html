<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Parking 3D — a 3D car parking game: steering wheel, pedals, parking sensors and 30 levels. / لعبة ركن سيارات ثلاثية الأبعاد.">
<title>Parking 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(12,18,32,.78);--line:rgba(255,255,255,.13);--txt:#f1f5f9;--mut:#94a3b8;--acc:#ffb703;--acc2:#fb8500;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:var(--txt);
  font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hide{display:none!important}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.tl,.tr{position:absolute;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.tl{left:calc(10px + env(safe-area-inset-left))}
.tr{right:calc(10px + env(safe-area-inset-right))}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px}
.ib:active{transform:scale(.92)}
.chips{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center}
.chip{padding:3px 11px;border-radius:12px;font-weight:800;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:5px;height:34px}
.dmg{display:flex;gap:3px}
.dmg i{width:7px;height:14px;border-radius:3px;background:rgba(255,255,255,.2)}
.dmg i.on{background:var(--bad);box-shadow:0 0 6px var(--bad)}
#hold{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:6px 16px 6px 8px;border-radius:999px;font-weight:800;font-size:15px;white-space:nowrap}
#hold svg{width:36px;height:36px;transform:rotate(-90deg)}
#hold circle{fill:none;stroke-width:4}
#hold .bg{stroke:rgba(255,255,255,.18)}
#hold #ring{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:100.5;stroke-dashoffset:100.5}
#banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;padding:14px 26px;border-radius:20px;
  transition:opacity .5s,transform .5s;opacity:0;min-width:240px;max-width:88vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .n{font-size:13px;color:var(--acc);font-weight:800;letter-spacing:1px}
#banner .t{font-size:26px;font-weight:900;line-height:1.3}
#banner .h{font-size:15px;color:#dbe4ef}
#banner .p{font-size:12px;color:var(--mut);margin-top:2px}

.ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.ctrl>*{pointer-events:auto}
#wheel{width:150px;height:150px;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#wheel svg{width:100%;height:100%;display:block}
.cluster{display:flex;align-items:flex-end;gap:10px}
.gear{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;margin-bottom:4px}
.gear button{width:46px;height:44px;font-weight:900;font-size:19px;color:var(--mut);touch-action:none}
.gear button.on{background:linear-gradient(#ffc933,#fb8500);color:#241500}
.gear button.on.r{background:linear-gradient(#ff7a7a,#dc2626);color:#fff}
.pedal{touch-action:none;border-radius:14px;background:linear-gradient(#69737f,#2b313a);box-shadow:0 5px 0 #0f1318,inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;transition:transform .06s,box-shadow .06s}
.pedal::before{content:'';position:absolute;inset:22px 9px 9px;border-radius:8px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 4px,rgba(255,255,255,.06) 4px 9px)}
.pedal span{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#e5e7eb}
.pedal.on{transform:translateY(4px) scaleY(.97);box-shadow:0 1px 0 #0f1318;filter:brightness(1.15)}
.brake{width:84px;height:76px}
.gasp{width:64px;height:122px}
.pad{width:74px;height:74px;border-radius:50%;font-size:28px;font-weight:900;display:grid;place-items:center;touch-action:none;color:#fff}
.pad.on{transform:scale(.93);background:rgba(255,183,3,.5)}
.pads{display:flex;gap:12px}
.pad.fw{background:rgba(34,197,94,.8)} .pad.bk{background:rgba(239,68,68,.8)}
#speedo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;padding:6px 14px 8px;border-radius:16px;min-width:100px}
#speedo b{font-size:30px;line-height:1;display:block;font-weight:900}
#speedo small{font-size:11px;color:var(--mut)}
#speedo .g{font-weight:900;color:var(--acc);margin-inline-start:6px;font-size:14px}
.sensor{display:flex;gap:3px;justify-content:center;margin-top:5px;direction:ltr}
.sensor i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.sensor i.g{background:var(--ok)} .sensor i.y{background:var(--acc)} .sensor i.r{background:var(--bad)}
@media (orientation:portrait){#speedo{bottom:calc(178px + env(safe-area-inset-bottom))}}
@media (max-height:430px){#wheel{width:124px;height:124px}.gasp{height:100px}.brake{height:64px;width:76px}}
#flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 110px 30px rgba(239,68,68,.85);opacity:0;transition:opacity .35s;z-index:11}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;touch-action:pan-y}
.screen.dim{background:rgba(5,10,20,.55)}
.panel{width:100%;max-width:460px;border-radius:24px;padding:20px;text-align:center;margin:auto}
.screen.main{align-items:flex-end;background:linear-gradient(transparent 45%,rgba(5,10,20,.75))}
.screen.main .panel{margin:0 auto;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
@media (orientation:landscape){.screen.main{align-items:center;justify-content:flex-start;background:linear-gradient(-90deg,rgba(5,10,20,.8),transparent 60%)}
  [dir=ltr] .screen.main{background:linear-gradient(90deg,rgba(5,10,20,.8),transparent 60%)}
  .screen.main .panel{margin:0;max-width:340px}}
.logo{direction:ltr;margin-bottom:6px}
.logo .l1{font-size:46px;font-weight:900;letter-spacing:3px;line-height:1.05;background:linear-gradient(#fff 20%,#ffd36b 60%,#fb8500);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.logo .l1 sup{font-size:20px;letter-spacing:0}
.logo .l2{font-size:20px;font-weight:800;color:#e2e8f0;text-shadow:0 2px 6px #000}
#bLang{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline-end:calc(12px + env(safe-area-inset-right));width:auto;padding:0 14px;font-weight:900;font-size:15px;z-index:21}
h2{margin:0 0 12px;font-size:24px;font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:16px;font-weight:900;font-size:18px;margin-top:10px;
  background:rgba(255,255,255,.1);border:1px solid var(--line);color:#fff}
.btn.pri{background:linear-gradient(180deg,#ffc933,#fb8500);color:#241500;border:0;box-shadow:0 5px 0 #9a4f00;font-size:21px}
.btn:active{transform:translateY(2px)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:6px}
@media (orientation:landscape){.levels{grid-template-columns:repeat(10,minmax(0,1fr))}}
.btn{position:relative}
.dot{position:absolute;top:6px;inset-inline-end:8px;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.day{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 2px;font-weight:800;font-size:12px;border:1px solid var(--line)}
.day b{display:block;font-size:16px;color:#ffd36b;margin-top:2px;direction:ltr}
.day.got{opacity:.4}
.day.now{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.day.big{grid-column:span 2}
.mlist{max-height:52vh;overflow:auto;margin:10px 0;text-align:start;touch-action:pan-y}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:6px}
.mi .tx{flex:1;min-width:0}
.mi b{font-size:14px;display:block}
.mi .bar{margin-top:5px}
.mi small{color:var(--mut);font-size:11px}
.mi button{padding:7px 10px;border-radius:10px;font-weight:900;font-size:13px;background:rgba(255,255,255,.1);white-space:nowrap;color:var(--mut)}
.mi button.go{background:linear-gradient(#ffc933,#fb8500);color:#241500}
.mi.done{opacity:.5}
.ver{margin-top:8px;font-size:12px;color:var(--mut)}
@media (max-width:380px){.panel{padding:16px 12px}}
.lv{border-radius:14px;padding:8px 2px 6px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:900;font-size:22px;line-height:1.1}
.lv small{display:block;font-size:10px;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.lv .st{display:block;font-size:11px;color:var(--acc);letter-spacing:1px}
.lv.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.lv:disabled{opacity:.4}
.total{color:var(--acc);font-weight:800;margin-bottom:6px}
.carsel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.cname{font-size:22px;font-weight:900;line-height:1.2}
.lock{font-size:13px;color:var(--acc);font-weight:800;min-height:18px}
.cstats{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center;font-size:13px;font-weight:800;margin-bottom:8px;text-align:start}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ffc933,#fb8500)}
@media (max-height:500px){#sGarage h2{font-size:18px;margin-bottom:2px}#sGarage .carsel{margin:0 0 4px}#sGarage .ib{width:38px;height:38px}
  .cname{font-size:18px}.cstats{gap:2px 10px;margin-bottom:4px}#sGarage .sw{gap:8px;margin:4px 0}#sGarage .sw button{width:32px;height:32px}
  #sGarage .btn{padding:8px;margin-top:6px}#sGarage .panel{padding:12px 16px}}
#coinChip{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline-start:calc(12px + env(safe-area-inset-left));z-index:21;font-size:16px;color:#ffd36b}
.earn{font-size:24px;font-weight:900;color:#ffd36b;margin:2px 0 4px;direction:ltr}
#bBuy{margin:0 0 8px;padding:9px}
.btn.ad{background:linear-gradient(180deg,#34d399,#059669);border:0;box-shadow:0 4px 0 #04603f;padding:10px}
#bFreeCoins{margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:calc(30% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:rgba(12,18,32,.92);color:#fff;
  padding:10px 18px;border-radius:14px;font-weight:800;max-width:86vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#adfake{position:fixed;inset:0;z-index:70;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif}
#adfake button{background:#fff;color:#111;border-radius:50%;width:44px;height:44px;font-size:20px}
#bBuy.poor{filter:grayscale(.7) brightness(.8)}
.lock.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sw{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0 6px}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.25);box-shadow:inset 0 -6px 10px rgba(0,0,0,.35)}
.sw button.on{border-color:var(--acc);transform:scale(1.12)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#241500}
.stars{font-size:52px;letter-spacing:6px;margin:4px 0;direction:ltr}
.stars span{display:inline-block;opacity:.18;filter:grayscale(1);transform:scale(.6);transition:all .35s cubic-bezier(.3,1.8,.5,1)}
.stars span.on{opacity:1;filter:none;transform:scale(1)}
.stats{display:flex;justify-content:center;gap:10px;margin:8px 0}
.stats div{background:rgba(255,255,255,.07);border-radius:14px;padding:6px 14px;font-weight:800}
.stats small{display:block;color:var(--mut);font-size:12px}
.mut{color:var(--mut);font-size:14px}
.how{font-size:13px;color:#cbd5e1;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px;margin-top:12px;line-height:1.7}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(#16213a,#070b14);transition:opacity .5s}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:14px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>

<div id="hud" class="hide" dir="ltr">
  <div class="tl"><button class="ib glass" id="bPause" aria-label="Pause">❚❚</button></div>
  <div class="chips">
    <div class="chip glass" id="cLvl">1/10</div>
    <div class="chip glass">⏱ <span id="time">0.0</span></div>
    <div class="chip glass"><span>🔧</span><div class="dmg" id="dmg"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="tr"><button class="ib glass" id="bCam" aria-label="Camera">🎥</button></div>
  <div id="hold" class="glass hide">
    <svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle id="ring" cx="20" cy="20" r="16"/></svg>
    <span id="holdLbl"></span>
  </div>
  <div id="banner" class="glass"><div class="n" id="bnN"></div><div class="t" id="bnT"></div><div class="h" id="bnH"></div><div class="p" id="bnP"></div></div>
  <div id="speedo" class="glass"><b id="kmh">0</b><small>km/h</small><span class="g" id="gearLbl">D</span>
    <div class="sensor" id="sensor"><i></i><i></i><i></i><i></i><i></i></div></div>

  <div class="ctrl" id="ctrlWheel">
    <div id="wheel">
      <svg viewBox="-50 -50 100 100">
        <defs>
          <radialGradient id="hub" cx="40%" cy="35%"><stop offset="0" stop-color="#5b6470"/><stop offset="1" stop-color="#1c2027"/></radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a414b"/><stop offset="1" stop-color="#121519"/></linearGradient>
        </defs>
        <g id="wheelG">
          <circle r="42" fill="none" stroke="url(#rim)" stroke-width="11"/>
          <circle r="42" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
          <path d="M-36 6 L-12 4 L-8 14 L8 14 L12 4 L36 6 L36 -2 L12 -4 L-12 -4 L-36 -2Z" fill="#262b33"/>
          <path d="M-7 12 L-5 36 L5 36 L7 12Z" fill="#262b33"/>
          <circle r="13" fill="url(#hub)" stroke="#0d0f12" stroke-width="1.5"/>
          <text y="4.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffb703" font-family="Cairo,sans-serif">P</text>
          <rect x="-3" y="-48" width="6" height="11" rx="2" fill="#ffb703"/>
        </g>
      </svg>
    </div>
    <div class="cluster">
      <div class="gear glass"><button id="gD" class="on">D</button><button id="gR" class="r">R</button></div>
      <button class="pedal brake hold" data-k="brake" aria-label="Brake"><span data-i18n="brake"></span></button>
      <button class="pedal gasp hold" data-k="gas" aria-label="Gas"><span data-i18n="gas"></span></button>
    </div>
  </div>

  <div class="ctrl hide" id="ctrlArrows">
    <div class="pads"><button class="pad glass hold" data-k="left">◀</button><button class="pad glass hold" data-k="right">▶</button></div>
    <div class="pads"><button class="pad bk hold" data-k="back">▼</button><button class="pad fw hold" data-k="fwd">▲</button></div>
  </div>
</div>
<div id="flash"></div>

<div id="sMain" class="screen main">
  <button class="ib glass" id="bLang"></button>
  <div class="panel glass">
    <div class="logo"><div class="l1">PARKING<sup>3D</sup></div><div class="l2" data-i18n="sub"></div></div>
    <button class="btn pri" id="bPlay" data-i18n="play"></button>
    <div class="row2"><button class="btn" id="bGarage" data-i18n="garage"></button><button class="btn" id="bSettings" data-i18n="settings"></button></div>
    <div class="row2"><button class="btn" id="bMissions"><span data-i18n="missions"></span><i class="dot hide" id="dMis"></i></button><button class="btn" id="bDaily"><span data-i18n="daily"></span><i class="dot hide" id="dDaily"></i></button></div>
  </div>
</div>

<div id="sLevels" class="screen dim hide">
  <div class="panel glass">
    <h2 data-i18n="chooseLevel"></h2>
    <div class="total" id="totalStars"></div>
    <div class="levels" id="levels"></div>
    <button class="btn" data-back data-i18n="back"></button>
  </div>
</div>

<div id="sGarage" class="screen main hide">
  <div class="panel glass">
    <h2 data-i18n="garage"></h2>
    <div class="carsel" dir="ltr"><button class="ib glass" id="cPrev">◀</button><div><div class="cname" id="cName"></div><div class="lock" id="cLock"></div></div><button class="ib glass" id="cNext">▶</button></div>
    <div class="cstats" id="cStats"></div>
    <button class="btn pri hide" id="bBuy"></button>
    <button class="btn ad hide" id="bFreeCoins" data-i18n="adFree"></button>
    <div class="mut" data-i18n="pickColor"></div>
    <div class="sw" id="swatches"></div>
    <button class="btn pri" data-back data-i18n="done"></button>
  </div>
</div>

<div id="sSettings" class="screen dim hide">
  <div class="panel glass">
    <h2 data-i18n="settings"></h2>
    <div class="set"><span data-i18n="language"></span><div class="seg" data-opt="lang"><button data-v="ar">العربية</button><button data-v="en">English</button><button data-v="fr">Français</button></div></div>
    <div class="set"><span data-i18n="controls"></span><div class="seg" data-opt="controls"><button data-v="wheel" data-i18n="wheel"></button><button data-v="arrows" data-i18n="arrows"></button></div></div>
    <div class="set"><span data-i18n="graphics"></span><div class="seg" data-opt="quality"><button data-v="high" data-i18n="high"></button><button data-v="low" data-i18n="low"></button></div></div>
    <div class="set"><span data-i18n="sound"></span><div class="seg" data-opt="sound"><button data-v="on" data-i18n="on"></button><button data-v="off" data-i18n="off"></button></div></div>
    <div class="how" data-i18n-html="how"></div>
    <a class="btn" id="lPrivacy" href="https://lhamami12.github.io/parking/privacy.html" target="_blank" rel="noopener" style="font-size:14px;padding:8px;text-decoration:none" data-i18n="privacy"></a>
    <button class="btn hide" id="bAdPriv" style="font-size:14px;padding:8px" data-i18n="adPriv"></button>
    <button class="btn" id="bReset" style="font-size:14px;padding:8px" data-i18n="reset"></button>
    <button class="btn pri" data-back data-i18n="done"></button>
    <div class="ver">Parking 3D v1.1</div>
  </div>
</div>

<div id="sDaily" class="screen dim hide">
  <div class="panel glass">
    <h2 data-i18n="daily"></h2>

function makePlayer(md) {
  const G = md.geo, root = new THREE.Group(), chassis = new THREE.Group();

  const tail = M.tail.clone(), rev = std({ color: 0xdddddd, emissive: 0xffffff, emissiveIntensity: 0 });

  add(G.paint, paint); add(G.cabin, M.glass); add(G.trim, M.trim); add(G.plate, M.plate, false);
  add(G.head, M.head, false); add(G.tail, tail, false); add(G.rev, rev, false);
  if (G.chromeBody) add(G.chromeBody, M.chrome);
  const front = [], spin = [], k = md.wr / .36;
  for (const [x, z] of G.WPOS) {

    pivot.position.set(x, md.wr, z); s.scale.setScalar(k);

  const heads = [];
  for (const sd of [-1, 1]) {
    const l = new THREE.SpotLight(0xfff1d6, 60, 40, .5, .6, 1.3);
    l.position.set(sd * (md.W / 2 - .32), md.headY, md.L / 2);

    l.visible = false;
    root.add(l, l.target); heads.push(l);

}

const COLORS = [0xe63946, 0x1d4ed8, 0xf3f4f6, 0x111827, 0xfacc15, 0x16a34a, 0xf97316, 0x7c3aed, 0x9ca3af, 0x0ea5e9];

function axes(rot) { const c = Math.cos(rot), s = Math.sin(rot); return [[c, -s], [s, c]]; }
/* Separating axis test between two oriented boxes: the push that moves a out of b, or null */
function sat(a, b) {
  const A = axes(a.rot), B = axes(b.rot), dx = b.x - a.x, dz = b.z - a.z;
  let best = Infinity, bn = null, bs = 1;
  for (const n of [A[0], A[1], B[0], B[1]]) {
    const ra = a.hw * Math.abs(A[0][0] * n[0] + A[0][1] * n[1]) + a.hl * Math.abs(A[1][0] * n[0] + A[1][1] * n[1]);
    const rb = b.hw * Math.abs(B[0][0] * n[0] + B[0][1] * n[1]) + b.hl * Math.abs(B[1][0] * n[0] + B[1][1] * n[1]);
    const d = dx * n[0] + dz * n[1], ov = ra + rb - Math.abs(d);
    if (ov <= 0) return null;
    if (ov < best) { best = ov; bn = n; bs = d > 0 ? 1 : -1; }
  }
  return [-bn[0] * bs * best, -bn[1] * bs * best];
}
/* Distance from the leading bumper to the nearest obstacle, for the parking sensors */
function sensorDist(sign) {
  const A = axes(car.th);
  let best = Infinity;
  for (const t of [-1, -.5, 0, .5, 1]) {
    const px = car.x + A[0][0] * HW * .95 * t + A[1][0] * HL * sign, pz = car.z + A[0][1] * HW * .95 * t + A[1][1] * HL * sign;
    for (const o of obstacles) {
      const dx = px - o.x, dz = pz - o.z;
      if (Math.abs(dx) > 8 || Math.abs(dz) > 8) continue;
      const B = axes(o.rot);
      const qx = Math.max(Math.abs(dx * B[0][0] + dz * B[0][1]) - o.hw, 0), qz = Math.max(Math.abs(dx * B[1][0] + dz * B[1][1]) - o.hl, 0);
      best = Math.min(best, Math.hypot(qx, qz));
    }
  }
  return best;
}

const ADS_LIVE = false;

const AD_UNITS = ADS_LIVE && !/X|N{4}/.test(AD_LIVE.interstitial + AD_LIVE.rewarded) ? AD_LIVE : AD_TEST;
const NATIVE = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor.Plugins : null;

const Ads = {
  native: null, test: /[?&]ads=test/.test(location.search), busy: false, last: Date.now(), results: 0,
  async init() {
    const P = NATIVE && NATIVE.AdMob;
    if (!P) return refreshAdButtons();

/* ---------- Simulation ---------- */
function physics(dt) {
  const arrows = save.controls === 'arrows';
  const left = keys.left || (arrows && touch.left), right = keys.right || (arrows && touch.right);
  const steerT = (keys.left || keys.right || arrows) ? (left ? 1 : 0) - (right ? 1 : 0) : -wheelAngle / WHEEL_MAX;
  const fwd = keys.fwd || (arrows && touch.fwd), back = keys.back || (arrows && touch.back);
  let gas = !arrows && touch.gas, brake = (!arrows && touch.brake) || keys.brake;
  if (fwd) { if (car.v < -.3) brake = true; else { setGear('D'); gas = true; } }
  if (back) { if (car.v > .3) brake = true; else { setGear('R'); gas = true; } }

  const dir = gear === 'D' ? 1 : -1, v0 = car.v;
  if (brake) { const f = BRAKE * dt; car.v = Math.abs(car.v) <= f ? 0 : car.v - Math.sign(car.v) * f; }
  else if (gas) car.v += dir * (car.v * dir < -.05 ? BRAKE : dir > 0 ? ACC : ACC_R) * dt;
  else { const f = FRIC * dt; car.v = Math.abs(car.v) <= f ? 0 : car.v - Math.sign(car.v) * f; }
  car.v = clamp(car.v, -MAXR, MAXF);
  brakeLit = brake || (gas && v0 * dir < -.05);
  throttle += ((gas ? 1 : 0) - throttle) * Math.min(1, dt * 5);

  const maxSteer = MAXSTEER - Math.min(Math.abs(car.v) / MAXF, 1) * .25;
  car.steer += clamp(steerT * maxSteer - car.steer, -STEER_RATE * dt, STEER_RATE * dt);
  const thDot = car.v / WB * Math.tan(car.steer);
  car.th += thDot * dt;
  car.x += Math.sin(car.th) * car.v * dt;
  car.z += Math.cos(car.th) * car.v * dt;
  const acc = (car.v - v0) / dt, k = Math.min(1, dt * 6);
  car.pitch += (clamp(-acc * .007, -.05, .05) - car.pitch) * k;
  car.roll += (clamp(car.v * thDot * .012, -.06, .06) - car.roll) * k;

  const me = { x: car.x, z: car.z, hw: HW, hl: HL, rot: car.th };
  let bumped = false;
  for (let it = 0; it < 4; it++) {
    let any = false;
    for (const o of obstacles) { const p = sat(me, o); if (p) { me.x += p[0]; me.z += p[1]; any = true; } }
    if (!any) break;
    bumped = true;
  }
  if (bumped) {
    const impact = Math.abs(car.v);
    car.x = me.x; car.z = me.z; car.v *= -.2;
    if (impact > .7 && hitCd <= 0) {
      hits++; hitCd = .6; shake = .35;
      updateDamage(); crash();
      const f = $('#flash'); f.style.opacity = 1; setTimeout(() => f.style.opacity = 0, 120);
      try { navigator.vibrate && navigator.vibrate(70); } catch (_) {}
      if (hits >= MAX_HITS) finish(false);
    }
  }
  hitCd -= dt;
}

const TOL = .3; // a little slack so a car touching the painted line still counts
function checkSpot(dt) {
  const A = axes(car.th), S = axes(spot.rot);
  let inside = true;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const cx = car.x + A[0][0] * HW * sx + A[1][0] * HL * sz - spot.x;
    const cz = car.z + A[0][1] * HW * sx + A[1][1] * HL * sz - spot.z;
    if (Math.abs(cx * S[0][0] + cz * S[0][1]) > spot.hw + TOL || Math.abs(cx * S[1][0] + cz * S[1][1]) > spot.hl + TOL) inside = false;
  }
  const d = wrap(car.th - spot.rot);
  const fwd = Math.abs(d) < .21, back = Math.abs(wrap(d - PI)) < .21;
  const dirOK = spot.dir === 'reverse' ? back : fwd || back;
  const ok = inside && dirOK && Math.abs(car.v) < .4;
  hold = ok ? hold + dt : 0;
  $('#hold').classList.toggle('hide', !inside);
  if (inside) {
    const t = tr();
    $('#holdLbl').textContent = ok ? t.hold : spot.dir === 'reverse' && fwd ? t.holdRev : !dirOK ? t.holdAlign : t.holdStop;
    $('#ring').style.strokeDashoffset = 100.5 * (1 - Math.min(1, hold / 1.2));
  }
  const t = performance.now() / 1000;
  spotFill.color.setHex(ok ? 0x2cf08a : inside ? 0xffb703 : 0x2cf08a);
  spotFill.opacity = ok ? .55 : .22 + Math.sin(t * 4) * .08;
  if (hold >= 1.2) finish(true);
}

function sensors(dt) {
  const sign = Math.abs(car.v) > .1 ? Math.sign(car.v) : gear === 'R' ? -1 : 1;
  sensorD = Math.abs(car.v) < 3.5 ? sensorDist(sign) : Infinity;
  const lvl = sensorD < .3 ? 5 : sensorD < .6 ? 4 : sensorD < .9 ? 3 : sensorD < 1.3 ? 2 : sensorD < 1.8 ? 1 : 0;
  $$('#sensor i').forEach((el, k) => { el.className = k < lvl ? (k < 2 ? 'g' : k < 4 ? 'y' : 'r') : ''; });
  if (lvl && (Math.abs(car.v) > .05 || gear === 'R')) {
    beepT -= dt;
    if (beepT <= 0) { tone(1250, lvl === 5 ? .14 : .07, 'sine', .07); beepT = lvl === 5 ? .14 : [0, .7, .45, .28, .16][lvl]; }
  } else beepT = 0;
}

function updateCam(dt, snap) {
  const tp = new THREE.Vector3(), tl = new THREE.Vector3();
  if (state === 'menu') {
    const garage = menuView === 'garage', r = (garage ? (portrait ? 9.5 : 6.2) : 8.5) * Math.max(1, HL / 2.25);
    const ox = portrait ? 0 : (save.lang === 'ar' ? 1 : -1) * (garage ? 1.2 : 1.6);
    tp.set(car.x + Math.cos(orbit) * r, garage && !portrait ? 2.2 : 3, car.z + Math.sin(orbit) * r);
    tl.set(car.x, portrait ? (garage ? -2.6 : -.9) : garage ? .4 : 1, car.z);
    // shift the look target sideways so the car sits beside the menu panel
    const side = new THREE.Vector3().subVectors(tl, tp).cross(new THREE.Vector3(0, 1, 0)).normalize().multiplyScalar(ox);
    tl.add(side); tp.add(side);
  } else if (state === 'win' || state === 'fail') {
    tp.set(car.x + Math.cos(orbit) * 7.5, 3.4, car.z + Math.sin(orbit) * 7.5); tl.set(car.x, .8, car.z);
  } else {
    const yaw = car.th + camYaw, fx = Math.sin(yaw), fz = Math.cos(yaw);
    if (camMode === 0) {
      const dist = portrait ? 9.5 : 7.8, h = (portrait ? 4.6 : 3.4) + camPitch * 4;
      tp.set(car.x - fx * dist, h, car.z - fz * dist); tl.set(car.x + Math.sin(car.th) * 1.5, .9, car.z + Math.cos(car.th) * 1.5);
    } else if (camMode === 1) {
      const dist = portrait ? 12 : 10, h = (portrait ? 13 : 10) + camPitch * 4;
      tp.set(car.x - fx * dist, h, car.z - fz * dist); tl.set(car.x, 0, car.z);
    } else {
      tp.set(car.x - Math.sin(camYaw) * 2, portrait ? 28 : 21, car.z - Math.cos(camYaw) * 2); tl.set(car.x, 0, car.z);
    }
    if (LEVELS[cur].indoor) { // stay inside the garage walls
      const [x0, x1, z0, z1] = bounds;
      const ox = tp.x, oz = tp.z;
      tp.x = clamp(tp.x, x0 + .5, x1 - .5); tp.z = clamp(tp.z, z0 + .5, z1 - .5);
      tp.y += Math.hypot(tp.x - ox, tp.z - oz) * 1.1; // pushed in by a wall: look down from higher up
    }
  }
  const k = snap ? 1 : 1 - Math.exp(-dt * 5);
  camPos.lerp(tp, k); camLook.lerp(tl, k);
  camera.position.copy(camPos);
  if (shake > 0) camera.position.add(new THREE.Vector3((R() - .5) * shake, (R() - .5) * shake, (R() - .5) * shake));
  camera.lookAt(camLook);
  sky.position.copy(camera.position);
}

function syncCar(dt) {
  P.root.position.set(car.x, 0, car.z);
  P.root.rotation.y = car.th;
  P.chassis.rotation.set(car.pitch, 0, car.roll);
  for (const p of P.front) p.rotation.y = car.steer;
  for (const s of P.spin) s.rotation.x += car.v * dt / WR;
  P.tail.emissiveIntensity = brakeLit ? 3.2 : .7;
  P.rev.emissiveIntensity = gear === 'R' && state === 'play' ? 2.2 : 0;
}

let lastHud = '';
function hud() {
  const kmh = Math.round(Math.abs(car.v) * 3.6), t = time.toFixed(1), s = kmh + '|' + t + '|' + gear;
  if (s === lastHud) return;

/* ---------- Confetti ---------- */
const fx = $('#fx'), fctx = fx.getContext('2d');
let confetti = [];
function burst() {
  const C = ['#ffb703', '#fb8500', '#22c55e', '#38bdf8', '#ef4444', '#a855f7', '#fff'];
  for (let i = 0; i < 160; i++) confetti.push({ x: fx.width / 2 + (R() - .5) * 80, y: fx.height * .35, vx: (R() - .5) * 14, vy: -R() * 14 - 4, s: 5 + R() * 6, c: C[i % C.length], a: R() * 6, va: (R() - .5) * .4 });
}
function drawConfetti(dt) {
  if (!confetti.length) return;
  fctx.clearRect(0, 0, fx.width, fx.height);
  const f = dt * 60;
  confetti = confetti.filter(p => p.y < fx.height + 20);
  for (const p of confetti) {
    p.vy += .35 * f; p.vx *= .99; p.x += p.vx * f; p.y += p.vy * f; p.a += p.va * f;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.a); fctx.fillStyle = p.c; fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fctx.restore();
  }
  if (!confetti.length) fctx.clearRect(0, 0, fx.width, fx.height);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  fx.width = w; fx.height = h;
  portrait = h > w;
  camera.aspect = w / h; camera.fov = portrait ? 68 : 52;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- Main loop ---------- */
let prev = performance.now(), clock = 0, firstFrame = true;
function loop(now) {
  const dt = Math.min((now - prev) / 1000, .1);
  prev = now; clock += dt;
  if (state === 'play') {
    // fixed small physics steps so slow phones drive the same as fast ones
    const n = Math.ceil(dt / .02);
    for (let k = 0; k < n && state === 'play'; k++) physics(dt / n);
    if (state === 'play') { time += dt; checkSpot(dt); sensors(dt); }
    hud();
    if (bannerT > 0 && (bannerT -= dt) <= 0) $('#banner').classList.remove('show');
    if (!look && Math.abs(car.v) > 1) { camYaw *= Math.exp(-dt * 1.5); camPitch *= Math.exp(-dt * 1.5); }
  } else if (state === 'win' || state === 'fail') {
    car.v *= Math.exp(-dt * 4); brakeLit = true;
    orbit += dt * .35;
  } else if (state === 'menu') {
    orbit += dt * (menuView === 'garage' ? .3 : .12);
    brakeLit = false;
  }
  if (!wheelDrag) wheelAngle *= Math.exp(-dt * 7);
  $('#wheelG').setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);
  shake = Math.max(0, shake - dt);
  if (arrow) { arrow.position.y = 3 + Math.sin(clock * 3) * .3; arrow.rotation.y += dt * 1.5; }
  syncCar(dt);
  updateCam(dt, false);
  if (ac && engGain) {
    const on = state === 'play' && !muted();
    engGain.gain.setTargetAtTime(on ? .035 + Math.abs(car.v) * .004 + throttle * .02 : 0, ac.currentTime, .1);
    const f = 42 + Math.abs(car.v) * 9 + throttle * 16;
    eng1.frequency.setTargetAtTime(f, ac.currentTime, .1);
    eng2.frequency.setTargetAtTime(f / 2, ac.currentTime, .1);
  }
  drawConfetti(dt);
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false; const l = $('#loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 500);
    if (NATIVE && NATIVE.SplashScreen) NATIVE.SplashScreen.hide().catch(() => {});
  }
  requestAnimationFrame(loop);
}

if (!MODELS[save.car]) save.car = 0;
setPlayerModel(save.car);
applyLang();
applyColor();
applySettings();
syncSettings();
buildLevel(0); placePlayer(0);
show('sMain');
updateCam(0, true);
requestAnimationFrame(loop);
Ads.init();
setTimeout(() => { if (state === 'menu' && !$('#sMain').classList.contains('hide') && dailyCan()) openDaily(); }, 1500);
// Android back button: pause while driving, otherwise step back through the menus
if (NATIVE && NATIVE.App) NATIVE.App.addListener('backButton', () => {
  if (Ads.busy) return;
  const open = SCREENS.find(id => !$('#' + id).classList.contains('hide'));
  if (state === 'play') pause();
  else if (open === 'sPause') resume();
  else if (open === 'sMain') NATIVE.App.exitApp();
  else if (open === 'sResult') goMenu('sLevels');
  else if (open) $(`#${open} [data-back]`).click();
});
window.game = { info: renderer.info, ads: Ads, save, MODELS, LEVELS, sat, get obstacles() { return obstacles; }, car, startLevel, finish, get state() { return state; }, get spot() { return spot; }, get hits() { return hits; } };
</script>
</body>
